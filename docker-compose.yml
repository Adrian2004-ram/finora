services:
  postgres:
    image: postgres:17
    container_name: finora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: